[project]
name = "pmq"
version = "0.1.0"
description = "Prediction-market quant system: Polymarket (global data) + Polymarket US + Kalshi (US execution)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42.0",       # Kalshi RSA-PSS + Polymarket US Ed25519 signing
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=8.3",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
pmq = "pmq.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042"]  # str,Enum kept for explicit-value serialization clarity

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
